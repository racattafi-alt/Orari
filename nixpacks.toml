# Root nixpacks.toml — usato quando Railway deploya dal root del repo
# Se invece il backend service ha Root Directory = "backend", usa backend/nixpacks.toml

[phases.install]
cmds = ["cd backend && npm install"]

[phases.build]
cmds = ["cd backend && npx prisma generate && npm run build"]

[start]
cmd = "cd backend && npx prisma db push && node dist/index.js"
